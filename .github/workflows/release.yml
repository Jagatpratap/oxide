name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a hyphen (v0.2.0-beta.1) are published as pre-releases.
# "Run workflow" on the Actions tab builds the downloads without publishing (for testing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libasound2-dev libdbus-1-dev libudev-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p oxide -p oxide_mcp_stdio
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="dev-${GITHUB_SHA::7}"; fi
          python3 scripts/package_release.py --target ${{ matrix.target }} --version "$version" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version: from its "## [x.y.z]" heading to the next "## ".
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found && !/^\[[^]]*\]: http/ { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No CHANGELOG.md section for $version; see the commit history." > notes.md
          fi
          cat >> notes.md <<'NOTES'

          ## Install

          1. Install Rust from https://rustup.rs (Oxide projects are Rust code, so the editor needs it).
          2. Download the archive for your computer below and unpack it anywhere.
          3. Run `bin/oxide` (Windows: `bin\oxide.exe`) to open the Oxide Hub.

          Full guide: [docs/GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/GETTING_STARTED.md).
          Each archive has a `.sha256` file to check the download.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Oxide $GITHUB_REF_NAME" --notes-file notes.md $prerelease
