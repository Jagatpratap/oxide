[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
oxide_math = { path = "crates/oxide_math" }
oxide_core = { path = "crates/oxide_core" }
oxide_render = { path = "crates/oxide_render" }
oxide_mcp = { path = "crates/oxide_mcp" }
oxide_engine = { path = "crates/oxide_engine" }
oxide_derive = { path = "crates/oxide_derive" }
oxide_assets = { path = "crates/oxide_assets" }
oxide_scene = { path = "crates/oxide_scene" }
oxide_input = { path = "crates/oxide_input" }
oxide_physics = { path = "crates/oxide_physics" }
oxide_audio = { path = "crates/oxide_audio" }
oxide_animation = { path = "crates/oxide_animation" }
oxide_ui = { path = "crates/oxide_ui" }
oxide_terrain = { path = "crates/oxide_terrain" }
oxide_text = { path = "crates/oxide_text" }
oxide_timeline = { path = "crates/oxide_timeline" }
oxide_shadergraph = { path = "crates/oxide_shadergraph" }
oxide_vfx = { path = "crates/oxide_vfx" }
oxide_uitk = { path = "crates/oxide_uitk" }
oxide_localization = { path = "crates/oxide_localization" }
oxide_lightmapper = { path = "crates/oxide_lightmapper" }
oxide_particles = { path = "crates/oxide_particles" }
oxide_navigation = { path = "crates/oxide_navigation" }
oxide_network = { path = "crates/oxide_network" }
oxide_standard = { path = "crates/oxide_standard" }
oxide_editor = { path = "crates/oxide_editor" }
oxide_dylib = { path = "crates/oxide_dylib" }
oxide_player = { path = "crates/oxide_player" }

glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
base64 = "0.22"
tiny_http = "0.12"
# Intel ISPC texture compressor (BC1-7, ASTC) for texture import.
intel_tex_2 = "0.5"
# KTX2 container parsing and its Zstandard supercompression.
ktx2 = "0.5"
ruzstd = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga", "bmp"] }
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_lights_punctual", "extras", "names", "utils"] }
rapier3d = "0.36"
kira = "0.12"
gilrs = "0.11"
serde_yaml_ng = "0.10"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links"] }
egui_dock = { version = "0.21", features = ["serde"] }
libloading = "0.9"

# SDF glyph generation runs in the editor; keep it fast in debug builds.
[profile.dev.package.oxide_text]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
# Third-party code keeps line tables only (readable backtraces, far smaller builds).
debug = "line-tables-only"

[workspace.lints.rust]
# intel_tex_2 ships prebuilt ISPC objects without a macOS platform load command; the
# linker notes it on every link. Harmless.
linker_messages = "allow"
