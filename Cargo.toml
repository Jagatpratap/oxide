[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
oxide_math = { path = "crates/oxide_math" }
oxide_core = { path = "crates/oxide_core" }
oxide_render = { path = "crates/oxide_render" }
oxide_mcp = { path = "crates/oxide_mcp" }
oxide_engine = { path = "crates/oxide_engine" }
oxide_derive = { path = "crates/oxide_derive" }
oxide_assets = { path = "crates/oxide_assets" }
oxide_scene = { path = "crates/oxide_scene" }
oxide_input = { path = "crates/oxide_input" }
oxide_physics = { path = "crates/oxide_physics" }
oxide_audio = { path = "crates/oxide_audio" }
oxide_animation = { path = "crates/oxide_animation" }
oxide_ui = { path = "crates/oxide_ui" }
oxide_terrain = { path = "crates/oxide_terrain" }
oxide_standard = { path = "crates/oxide_standard" }

glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
base64 = "0.22"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga", "bmp"] }
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_lights_punctual", "extras", "names", "utils"] }
rapier3d = "0.36"
kira = "0.12"
gilrs = "0.11"
serde_yaml_ng = "0.10"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links"] }
egui_dock = "0.21"

[profile.dev.package."*"]
opt-level = 2
